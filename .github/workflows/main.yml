name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.0

      - name: Find project
        run: |
          FILE=$(find . -name settings.gradle -not -path '*/.git/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "No settings.gradle found. Repo contents:"
            find . -maxdepth 3 -not -path '*/.git*'
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Building in $DIR"

      - name: Build
        run: gradle build --stacktrace --no-daemon
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: variantstrims
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
